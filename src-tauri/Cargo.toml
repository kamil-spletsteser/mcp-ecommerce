[package]
name = "ecommerce-mcp"
version = "0.1.0"
description = "E-commerce MCP — lokalny serwer MCP dla kont e-commerce"
edition = "2021"
publish = false
rust-version = "1.89"

[lib]
name = "ecommerce_mcp"
path = "src/lib.rs"

[[bin]]
name = "ecommerce-mcp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time"] }
# native-tls: systemowy TLS (Security.framework / SChannel) — bez kompilacji aws-lc (cmake/NASM) na Windows
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "form", "query"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
keyring = "4"
async-trait = "0.1"
dirs = "6"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6"
form_urlencoded = "1"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
